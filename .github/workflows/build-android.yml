name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Buildozer installieren
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Buildozer Konfiguration erstellen
        run: |
          buildozer init

      - name: Buildozer konfigurieren
        run: |
          sed -i 's/^title = .*/title = Dodge/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = dodge/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.dodge/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,pygame/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = landscape/' buildozer.spec

      - name: APK bauen
        run: |
          buildozer -v android debug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Dodge-Android
          path: bin/*.apk
